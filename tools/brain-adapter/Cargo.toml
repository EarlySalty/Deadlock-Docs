[package]
name = "deadlock-docs-brain-adapter"
version = "0.1.0"
edition = "2021"
rust-version = "1.97.1"
publish = false

[workspace]

[dependencies]
brain-client = { git = "https://github.com/EarlySalty/Deadlock-Brain.git", rev = "3b86d3cbe5ea39a67b8b1fbd8a3d48ab935982ef" }
uplink-infisical-transport = { git = "https://github.com/EarlySalty/Deadlock-Brain.git", rev = "3b86d3cbe5ea39a67b8b1fbd8a3d48ab935982ef" }
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros"] }
zeroize = "1"

[dev-dependencies]
tempfile = "3"
